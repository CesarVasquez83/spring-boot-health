version: "3.9"

services:
  demo-postgres:
    image: postgres:16
    container_name: demo-postgres
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo-app
    depends_on:
      demo-postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://demo-postgres:5432/demo
      SPRING_DATASOURCE_USERNAME: demo
      SPRING_DATASOURCE_PASSWORD: demo
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000

  demo-frontend:
    build:
      context: ./demo-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    container_name: demo-frontend
    depends_on:
      - demo-app
    ports:
      - "3000:3000"
